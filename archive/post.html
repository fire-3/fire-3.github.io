<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 头部内容同index.html -->
</head>
<body>
    <!-- 导航同index.html -->
    
    <div class="container">
        <article class="single-post">
            <!-- 文章标题 -->
            <header class="post-header">
                <h1 class="post-title">文章标题</h1>
                <div class="post-meta">
                    <span class="post-date">发布日期</span>
                    <span class="post-category">分类</span>
                    <span class="post-readtime">阅读时间</span>
                </div>
            </header>
            
            <!-- 文章内容 -->
            <div class="post-content">
                <!-- 这里放文章正文，支持：
                - 标题 h2-h6
                - 段落 p
                - 代码块 pre code
                - 引用 blockquote
                - 列表 ul/ol
                - 图片 img
                - 表格 table
                - 分割线 hr
                -->
            </div>
            
            <!-- 文章标签 -->
            <footer class="post-footer">
                <div class="post-tags">
                    <span class="tag">标签1</span>
                    <span class="tag">标签2</span>
                </div>
                
                <!-- 上一篇/下一篇 -->
                <div class="post-navigation">
                    <a href="#" class="prev-post">← 上一篇</a>
                    <a href="index.html" class="back-to-home">返回列表</a>
                    <a href="#" class="next-post">下一篇 →</a>
                </div>
            </footer>
        </article>
    </div>

    <!-- 页脚同index.html -->
</body>
</html>
