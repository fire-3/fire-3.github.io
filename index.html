<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Language" content="zh-CN, ja, en">
    <title>炎诉的个人博客</title>
    <link rel="stylesheet" href="style.css">
    <!-- 图标和字体 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 必须添加：Markdown解析库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- 可选：添加PWA支持 -->
    <meta name="theme-color" content="#4a6fa5">
</head>
    <!-- 极简音乐控制 -->
    <div class="simple-music">
       <!-- 修改现有的audio标签 -->
<audio id="bgm" loop preload="auto" crossorigin="anonymous">
    <source src="music/bgm.mp3" type="audio/mpeg">
    <source src="music/bgm.ogg" type="audio/ogg"> <!-- 可选，兼容性更好 -->
</audio>
        <button id="music-toggle" class="music-toggle-btn" title="点击暂停音乐">
            <i class="fas fa-volume-up"></i>
            <i class="fas fa-volume-mute"></i>
        </button>
    </div>
<body>
 <!-- 图片背景层 -->
    <div class="bg-image-layer"></div>
    
    <!-- 粒子效果层 -->
    <canvas id="particles-bg"></canvas>
    
    <!-- 内容遮罩层（让文字更清晰） -->
    <div class="bg-overlay"></div>
    <!-- 顶部导航 -->
    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <!-- 博客标题 -->
                <div class="site-brand">
                    <h1 class="site-title">
                        <a href="index.html">今天又学习了么</a>
                    </h1>
                    <p class="site-subtitle">好きなことを好きと言っていいんだよ 好きなことを好きにやっていいんだよ
</p>
                </div>
                
                <!-- 导航菜单 -->
                <nav class="site-nav">
                    <a href="index.html" class="nav-item">首页</a>
                    <a href="#categories" class="nav-item">分类</a>
                    <a href="about.html" class="nav-item">关于</a>
                    <a href="#archive" class="nav-item">归档</a>
                </nav>
                
                <!-- 主题切换按钮 -->
                <button id="theme-toggle" class="theme-btn">
                    <i class="fas fa-moon"></i>
                    <i class="fas fa-sun"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要内容区 -->
    <div class="container main-container">
        <main class="content-area">
            <!-- ===== 修改点1：文章列表容器 ===== -->
            <div id="posts-container" class="posts-container">
                <!-- JavaScript会动态加载文章到这里 -->
                <!-- 保留静态示例作为回退 -->
                <article class="blog-post">
                    <div class="post-header">
                        <h2 class="post-title">
                            <a href="archive/post1.html">加载文章中...</a>
                        </h2>
                        <div class="post-meta">
                            <span class="post-date">请稍候</span>
                            <span class="post-category">加载中</span>
                            <span class="post-readtime">...</span>
                        </div>
                    </div>
                    <div class="post-content">
                        <p>正在从 articles.json 加载文章数据...</p>
                    </div>
                    <div class="post-footer">
                        <a href="javascript:void(0)" class="read-more" onclick="loadArticleList()">
                            点击重试 <i class="fas fa-redo"></i>
                        </a>
                    </div>
                </article>
            </div>
            
            <!-- ===== 修改点2：分页容器 ===== -->
            <div class="pagination" id="pagination">
                <!-- 分页将通过JavaScript动态生成 -->
            </div>
        </main>

        <!-- 侧边栏 -->
        <aside class="sidebar">
            <!-- 搜索框 -->
            <div class="sidebar-widget search-widget">
                <div class="widget-title">
                    <h3>搜索</h3>
                </div>
                <div class="widget-content">
                    <input type="text" placeholder="搜索文章...">
                </div>
            </div>
            
            <!-- 关于 -->
            <div class="sidebar-widget about-widget">
                <div class="widget-title">
                    <h3><i class="fas fa-user"></i> About me</h3>
                </div>
                <div class="widget-content">
                    <!-- 头像部分 -->
                    <div class="author-avatar">
                        <img src="images/avatar.jpg" alt="炎诉的头像" class="avatar">
                    </div>
                    
                    <!-- 名字 -->
                    <h4 class="author-name">炎诉</h4>
                    
                    <!-- 介绍 -->
                    <p class="author-bio">
                        来自上海交通大学<br>
                        正在筹备跑路的物理er<br>
                        什么都懂一点，什么都只懂一点
                    </p>
                    
                    <!-- 社交链接 -->
                    <div class="author-social">
                        <a href="https://github.com/fire-3" 
                           class="social-link" 
                           target="_blank"
                           title="GitHub - 查看我的代码"
                           onclick="trackSocialClick('github')">
                            <i class="fab fa-github"></i>
                        </a>
                        
                        <a href="javascript:void(0)" 
                           class="social-link" 
                           title="点击复制邮箱地址"
                           onclick="copyToClipboard('你的邮箱@example.com', 'email')">
                            <i class="fas fa-envelope"></i>
                        </a>
                        
                        <a href="https://space.bilibili.com/277602164" 
                           class="social-link" 
                           target="_blank"
                           title="Bilibili - 关注我的频道"
                           onclick="trackSocialClick('bilibili')">
                            <i class="fas fa-play-circle"></i>
                        </a>
                        
                        <a href="#" 
                           class="social-link" 
                           title="更多联系方式"
                           onclick="showContactModal()">
                            <i class="fas fa-ellipsis-h"></i>
                        </a>
                    </div>
                </div>
            </div>
            
            <!-- 分类 -->
            <div class="sidebar-widget categories-widget">
                <div class="widget-title">
                    <h3>分类</h3>
                </div>
                <div class="widget-content">
                    <!-- 分类列表将通过JavaScript动态生成 -->
                </div>
            </div>
            
            <!-- ===== 修改点3：最新文章侧边栏 ===== -->
            <div class="sidebar-widget recent-posts">
                <div class="widget-title">
                    <h3>最新文章</h3>
                </div>
                <div class="widget-content" id="recent-posts-list">
                    <!-- 最新文章将通过JavaScript动态加载 -->
                    <div style="text-align: center; color: #666; padding: 10px;">
                        <i class="fas fa-spinner fa-spin"></i> 加载中...
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- 页脚 -->
    <footer class="site-footer">
        <div class="container">
            <p>版权信息</p>
            <p>联系方式或其它信息</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
