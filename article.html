<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章详情 - 炎诉的个人博客</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <!-- 背景层 -->
    <div class="bg-image-layer"></div>
    <canvas id="particles-bg"></canvas>
    <div class="bg-overlay"></div>
    
    <!-- 头部导航 -->
    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <div class="site-brand">
                    <h1 class="site-title">
                        <a href="index.html">今天又学习了么</a>
                    </h1>
                </div>
                <nav class="site-nav">
                    <a href="index.html" class="nav-item">返回首页</a>
                </nav>
            </div>
        </div>
    </header>
    
    <!-- 文章内容 -->
    <div class="container main-container">
        <main class="content-area">
            <div id="article-content">
                <!-- 文章将通过JavaScript动态加载 -->
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i> 加载文章中...
                </div>
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
    // 在 article.html 的 <script> 标签中替换整个逻辑
document.addEventListener('DOMContentLoaded', async function() {
    const urlParams = new URLSearchParams(window.location.search);
    const articleId = urlParams.get('id');
    
    console.log('文章ID:', articleId);
    
    if (!articleId) {
        console.log('没有文章ID，跳转到首页');
        window.location.href = 'index.html';
        return;
    }
    
    try {
        // 1. 先加载文章数据
        console.log('加载articles.json...');
        const response = await fetch('articles.json');
        if (!response.ok) {
            throw new Error(`articles.json加载失败: ${response.status}`);
        }
        
        const data = await response.json();
        console.log('找到文章数据，总数:', data.articles.length);
        
        // 2. 查找对应文章
        const article = data.articles.find(a => a.id == articleId);
        if (!article) {
            throw new Error(`找不到ID为 ${articleId} 的文章`);
        }
        
        console.log('找到文章:', article.title);
        console.log('文章数据:', article);
        
        // 3. 获取文章内容
        let content = '';
        
        if (article.file) {
            console.log('尝试从文件加载:', article.file);
            try {
                const fileResponse = await fetch(article.file);
                if (fileResponse.ok) {
                    const fileContent = await fileResponse.text();
                    console.log('文件加载成功，大小:', fileContent.length);
                    
                    // 提取Markdown正文（去掉可能的YAML front matter）
                    const lines = fileContent.split('\n');
                    let contentLines = [];
                    let inContent = false;
                    
                    for (const line of lines) {
                        if (line.trim().startsWith('#') || inContent) {
                            inContent = true;
                            contentLines.push(line);
                        }
                    }
                    
                    content = contentLines.join('\n');
                    if (!content.trim()) {
                        content = fileContent; // 如果没找到#开头，使用全部内容
                    }
                } else {
                    console.warn('文件加载失败，状态:', fileResponse.status);
                }
            } catch (fileError) {
                console.warn('文件加载错误:', fileError);
            }
        }
        
        // 4. 如果文件内容为空，使用JSON中的content
        if (!content.trim() && article.content) {
            console.log('使用JSON中的content');
            content = article.content;
        }
        
        // 5. 如果仍然为空，使用默认内容
        if (!content.trim()) {
            console.warn('文章内容为空，使用默认内容');
            content = `# ${article.title}\n\n文章内容正在加载中...\n\n*请检查 ${article.file || '文章文件'} 是否存在且内容正确。*`;
        }
        
        console.log('最终内容长度:', content.length);
        console.log('内容预览:', content.substring(0, 100));
        
        // 6. 渲染文章
        renderArticle(article, content);
        
    } catch (error) {
        console.error('加载文章失败:', error);
        showErrorMessage(`文章加载失败: ${error.message}`);
    }
});

function renderArticle(article, content) {
    const container = document.getElementById('article-content');
    if (!container) return;
    
    try {
        // 确保marked有内容
        if (!content || content.trim() === '') {
            throw new Error('文章内容为空');
        }
        
        // 解析Markdown
        let parsedContent = '';
        try {
            parsedContent = marked.parse(content);
        } catch (markedError) {
            console.error('Markdown解析失败:', markedError);
            parsedContent = `<h1>${escapeHtml(article.title)}</h1>
                            <div class="markdown-error">
                                <p>Markdown解析失败，显示原始内容：</p>
                                <pre>${escapeHtml(content.substring(0, 1000))}</pre>
                            </div>`;
        }
        
        // 创建文章HTML
        container.innerHTML = `
            <article class="blog-post">
                <div class="post-header">
                    <h1 class="post-title">${escapeHtml(article.title)}</h1>
                    <div class="post-meta">
                        <span class="post-date">
                            <i class="far fa-calendar"></i> ${formatDate(article.date)}
                        </span>
                        <span class="post-category">
                            <i class="fas fa-folder"></i> ${escapeHtml(article.category)}
                        </span>
                        <span class="post-readtime">
                            <i class="far fa-clock"></i> ${escapeHtml(article.readTime || '5分钟')}
                        </span>
                    </div>
                </div>
                <div class="post-content article-content">
                    ${parsedContent}
                </div>
                <div class="post-footer">
                    <div class="post-tags">
                        ${(article.tags || []).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
                    </div>
                    <a href="index.html" class="read-more">
                        <i class="fas fa-arrow-left"></i> 返回文章列表
                    </a>
                </div>
            </article>
        `;
        
        // 更新页面标题
        document.title = `${article.title} - 炎诉的个人博客`;
        
    } catch (error) {
        console.error('渲染文章失败:', error);
        container.innerHTML = `
            <div class="no-posts-message">
                <i class="fas fa-exclamation-triangle"></i>
                <h3>文章渲染失败</h3>
                <p>${error.message}</p>
                <p><strong>文章ID:</strong> ${article.id}</p>
                <p><strong>文章标题:</strong> ${article.title}</p>
                <p><strong>文件路径:</strong> ${article.file || '无'}</p>
                <a href="index.html" class="action-button">返回首页</a>
            </div>
        `;
    }
}

// 辅助函数
function formatDate(dateString) {
    try {
        const date = new Date(dateString);
        return date.toLocaleDateString('zh-CN', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });
    } catch (e) {
        return dateString || '未知日期';
    }
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showErrorMessage(msg) {
    const container = document.getElementById('article-content');
    if (container) {
        container.innerHTML = `
            <div class="no-posts-message">
                <i class="fas fa-exclamation-triangle"></i>
                <h3>${msg}</h3>
                <a href="index.html" class="action-button">返回首页</a>
            </div>
        `;
    }
}
</body>
</html>
